<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — MedGuard AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: radial-gradient(circle at center, #ffffff 0%, #eff6ff 50%, #fdf2f8 100%); }
        .login-card { background: #ffffff; border: 1.5px solid rgba(59,130,246,0.25); border-radius: 20px; padding: 3rem; width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(59,130,246,0.12), 0 10px 20px -5px rgba(236,72,153,0.08); animation: slide-up 0.5s ease forwards; }
        .login-header { text-align: center; margin-bottom: 2.5rem; }
        .login-icon { font-size: 3rem; margin-bottom: 1rem; }
        .login-title { font-size: 1.6rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem; }
        .login-sub { font-size: 0.9rem; color: #64748b; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 0.5rem; }
        .form-input { width: 100%; background: #f8fafc; border: 1px solid rgba(59,130,246,0.2); border-radius: 10px; color: #1e293b; font-family: 'Outfit', sans-serif; font-size: 1rem; padding: 1rem 1.25rem; outline: none; transition: all 0.2s; }
        .form-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.15); background: #ffffff; }
        
        .login-btn { width: 100%; padding: 1rem; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; border-radius: 10px; color: #fff; font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 18px rgba(59,130,246,0.35); margin-top: 1rem; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(59,130,246,0.5); background: linear-gradient(135deg, #2563eb, #1e40af); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .error-msg { background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.3); color: #e11d48; padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.5rem; text-align: center; display: none; }
        
        @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">🛡️</div>
                <h1 class="login-title">Admin Login</h1>
                <p class="login-sub">Secure access to MedGuard Dashboard</p>
            </div>
            
            <div id="errorMsg" class="error-msg"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="admin" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">Log In to Dashboard</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('errorMsg');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            btn.disabled = true;
            btn.textContent = 'Authenticating...';
            errorEl.style.display = 'none';
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    btn.textContent = 'Success! Redirecting...';
                    btn.style.background = '#10b981';
                    btn.style.boxShadow = '0 4px 18px rgba(16,185,129,0.3)';
                    setTimeout(() => { window.location.href = '/admin.html'; }, 500);
                } else {
                    throw new Error(data.error || 'Invalid credentials');
                }
            } catch (err) {
                errorEl.textContent = '❌ ' + err.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Log In to Dashboard';
            }
        });
    </script>
</body>
</html>
