services:
  - type: web
    name: medguard-ai-receptionist
    env: node
    rootDir: ai-receptionist
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: hpp4J3VqNfWAUOO0d1Us
